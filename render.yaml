databases:
  - name: sidcar-db
    plan: basic-256mb
    databaseName: sidcar
    user: sidcar

services:
  - type: web
    name: sidcar-gestao
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sidcar-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
